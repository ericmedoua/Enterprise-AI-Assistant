name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_NAME: enterprise-ai-assistant
      API_VERSION: v1
      DEBUG: "false"
      HOST: 127.0.0.1
      PORT: 8000

      JWT_SECRET_KEY: ci-only-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: enterprise_ai_assistant
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres

      CHROMA_PATH: ./chroma_db
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      HF_HOME: ~/.cache/huggingface

      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deterministic tests
        run: |
          pytest -q \
            tests/test_benchmark.py \
            tests/test_retrieval_evaluator.py \
            tests/test_groundedness_evaluator.py \
            tests/test_relevance_evaluator.py \
            tests/test_semantic_relevance_evaluator.py \
            tests/test_semantic_relevance_calibrator.py \
            tests/test_rag_evaluation.py \
            tests/test_evaluation_report.py \
            tests/test_quality_gate.py \
            tests/test_quality_gate_reporter.py