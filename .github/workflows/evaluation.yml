name: Evaluation Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  evaluation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: enterprise_ai_assistant
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d enterprise_ai_assistant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_NAME: enterprise-ai-assistant
      API_VERSION: v1
      DEBUG: "false"
      HOST: 127.0.0.1
      PORT: 8000

      JWT_SECRET_KEY: ci-only-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: enterprise_ai_assistant
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres

      CHROMA_PATH: ./chroma_db
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      HF_HOME: ~/.cache/huggingface

      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        run: |
          alembic upgrade head    

      - name: Run tests
        run: |
          pytest -q

      - name: Prepare embedding model
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"    

      - name: Run evaluation gate
        run: |
          python -m app.ai.evaluation.cli

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-ci-report
          path: artifacts/evaluation-ci-report.txt