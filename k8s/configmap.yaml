apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: enterprise-ai
data:
  APP_NAME: "Enterprise AI Assistant"
  API_VERSION: "v1"
  DEBUG: "false"
  HOST: "0.0.0.0"
  PORT: "8000"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "enterprise_ai_db"
  DATABASE_USER: "postgres"
  EMBEDDING_MODEL: "all-MiniLM-L6-v2"
  LOG_LEVEL: INFO